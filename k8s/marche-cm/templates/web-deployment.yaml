apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marche-cm.fullname" . }}-web
  labels:
    {{- include "marche-cm.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "marche-cm.selector" (merge (dict "component" "web") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "marche-cm.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "marche-cm.serviceAccountName" . }}
      securityContext:
        {{- include "marche-cm.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "marche-cm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "marche-cm.containerSecurityContext" . | nindent 12 }}
          # CMD par défaut du Dockerfile = daphne ASGI :8000.
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          envFrom:
            {{- include "marche-cm.envFrom" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
