{{- if .Values.finops.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marche-cm.fullname" . }}-finops
  labels:
    {{- include "marche-cm.labels" . | nindent 4 }}
    app.kubernetes.io/component: finops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "marche-cm.selector" (merge (dict "component" "finops") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "marche-cm.labels" . | nindent 8 }}
        app.kubernetes.io/component: finops
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "marche-cm.serviceAccountName" . }}
      securityContext:
        {{- include "marche-cm.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: finops
          image: {{ include "marche-cm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "marche-cm.containerSecurityContext" . | nindent 12 }}
          command: ["sh", "-c"]
          args:
            - >
              while true; do
                python manage.py run_financial_ops --skip-reconciliation --max-retries {{ .Values.finops.maxRetries }};
                sleep {{ .Values.finops.intervalSeconds }};
              done
          envFrom:
            {{- include "marche-cm.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.finops.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
