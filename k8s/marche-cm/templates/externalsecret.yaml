{{- if .Values.externalSecrets.enabled }}
# Nécessite External Secrets Operator (ESO) installé dans le cluster + un rôle
# IRSA autorisant ssm:GetParameter sur le préfixe. Tire les secrets depuis AWS
# SSM Parameter Store vers le Secret consommé par les pods.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "marche-cm.fullname" . }}-ssm
  labels:
    {{- include "marche-cm.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.externalSecrets.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "marche-cm.serviceAccountName" . }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "marche-cm.fullname" . }}
  labels:
    {{- include "marche-cm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "marche-cm.fullname" . }}-ssm
    kind: SecretStore
  target:
    name: {{ include "marche-cm.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $secretKey, $ssmKey := .Values.externalSecrets.keys }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.externalSecrets.ssmPrefix $ssmKey }}
    {{- end }}
{{- end }}
