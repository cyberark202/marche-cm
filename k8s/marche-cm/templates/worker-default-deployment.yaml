apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marche-cm.fullname" . }}-worker-default
  labels:
    {{- include "marche-cm.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-default
spec:
  replicas: {{ .Values.workerDefault.replicas }}
  selector:
    matchLabels:
      {{- include "marche-cm.selector" (merge (dict "component" "worker-default") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "marche-cm.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker-default
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "marche-cm.serviceAccountName" . }}
      securityContext:
        {{- include "marche-cm.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "marche-cm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "marche-cm.containerSecurityContext" . | nindent 12 }}
          args:
            {{- toYaml .Values.workerDefault.args | nindent 12 }}
          envFrom:
            {{- include "marche-cm.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.workerDefault.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
