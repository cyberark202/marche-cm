apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "marche-cm.configName" . }}
  labels:
    {{- include "marche-cm.labels" . | nindent 4 }}
  annotations:
    # Créé AVANT le Job de migration (hook poids 0) et persistant pour les pods
    # applicatifs normaux. before-hook-creation = recréé proprement à l'upgrade.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
