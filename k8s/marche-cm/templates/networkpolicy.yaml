{{- if .Values.networkPolicy.enabled }}
# Redis n'accepte que le trafic des composants applicatifs du release.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "marche-cm.fullname" . }}-redis
  labels:
    {{- include "marche-cm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "marche-cm.selector" (merge (dict "component" "redis") .) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
