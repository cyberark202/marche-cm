{{- if and .Values.secret.create (not .Values.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "marche-cm.secretName" . }}
  labels:
    {{- include "marche-cm.labels" . | nindent 4 }}
  annotations:
    # Même phase que le ConfigMap : disponible pour le Job de migration.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
