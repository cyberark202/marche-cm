name: project
description: "Marché CM — Console d'administration (app dédiée)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── State management ─────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Networking (shared security stack with the other apps) ───────────────
  # Interceptors: device binding, correlation IDs, nonce, reactive refresh.
  dio: ^5.7.0
  # Used only for the token-refresh call (no auth header dependency).
  http: ^1.2.2
  # Tokens stored in Android Keystore / iOS Keychain — never SharedPreferences.
  flutter_secure_storage: ^9.2.2
  # Realtime events (/ws/events/) + runtime-config cache — aligné sur les autres apps.
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  # Brand font — Plus Jakarta Sans (design source: theme.jsx). Same as the other apps.
  google_fonts: ^6.2.1

  # ── Firebase (admin is a web console) ────────────────────────────────────
  # Web uses the shared marche-cm web config. Android/iOS are not registered
  # for the admin app, so init is guarded and degrades gracefully there.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon_source.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon_source.png"
    background_color: "#FFFFFF"
    theme_color: "#15803D"

flutter:
  uses-material-design: true
