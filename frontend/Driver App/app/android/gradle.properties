org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# Cache incrémental Kotlin désactivé : le pub cache (C:) et le projet (E:) sont
# sur des disques différents, ce qui fait planter RelocatableFileToPathConverter
# ("this and base files have different roots"). Voir Clients/android/gradle.properties.
kotlin.incremental=false
