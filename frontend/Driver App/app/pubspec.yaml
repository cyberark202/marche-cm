name: driver_app
description: "Market CM Driver — Application pour livreurs et coursiers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management (Riverpod)
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  cached_network_image: ^3.4.1

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # WebSocket
  web_socket_channel: ^3.0.1
  # Runtime-config fetch (forced-update / kill switch) — aligné sur les autres apps.
  http: ^1.2.2

  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Carte (OpenStreetMap, sans cle API) pour le suivi GPS temps reel
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Media / uploads
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  # Chat : lecture des notes vocales reçues (just_audio) + ouverture des
  # documents joints (url_launcher) — parité avec les apps Clients/vendeur.
  just_audio: ^0.9.42
  url_launcher: ^6.2.6

  # Connectivity
  connectivity_plus: ^6.0.0

  # Local storage (non-sensitive UI prefs only)
  shared_preferences: ^2.3.2

  # ── Push notifications (Firebase) ────────────────────────────────────────
  # Android: google-services.json + google-services plugin (already wired).
  # Web: init is guarded so an unreachable Firebase CDN never blanks the app
  # (previous blank-web issue). WebSocket realtime remains the primary channel.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # UI
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  animations: ^2.0.11
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8
  country_picker: ^2.0.27

  # Utils
  intl: ^0.20.2
  crypto: ^3.0.6

  # Localization (MaterialLocalizations / CupertinoLocalizations fr)
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon_source.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon_source.png"
    background_color: "#FFFFFF"
    theme_color: "#15803D"

flutter:
  uses-material-design: true
